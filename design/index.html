<style>*{box-sizing:border-box}body{margin:0;background:#101318;color:#e8ecf2;font:14px system-ui,-apple-system,sans-serif}header{height:76px;display:flex;align-items:center;gap:20px;border-bottom:1px solid #303640;padding:0 24px}strong{letter-spacing:3px;font-size:20px}header span{color:#a0aab8;font-size:12px}header a{color:#92c0ff;margin-left:auto}main{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 76px)}nav{padding:18px 12px;background:#191e25;border-right:1px solid #303640}button{display:flex;gap:14px;width:100%;text-align:left;padding:13px;border:0;border-radius:10px;background:transparent;color:#9ea9b9;cursor:pointer;font:inherit;font-size:12px}button span{color:#e8ecf2}button:hover,button.active{background:#263c59;color:#8bc0ff}section{padding:24px;min-width:0}h1{margin:0;font-size:19px;font-weight:500}.caption{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.caption a{color:#8cbfff;text-decoration:none;font-size:12px}img{display:block;width:100%;height:auto;max-width:1600px;border:1px solid #303640;box-shadow:0 12px 42px #0006}p{font-size:12px;line-height:1.8;color:#a0aab8;margin-top:18px}button:focus-visible,a:focus-visible{outline:2px solid #8cbfff;outline-offset:3px}@media(max-width:850px){main{grid-template-columns:180px minmax(0,1fr)}section{padding:14px}header span{display:none}nav{padding:12px 6px}button{font-size:11px;padding:10px 8px}}.brand-logo{width:178px;height:40px;object-fit:contain;border:0;box-shadow:none}.artboard-wrap{position:relative}#source-switch{position:absolute;display:flex;padding:0;background:#292f38;border:1px solid #3a4350;border-radius:10px;isolation:isolate}#source-switch button{position:relative;z-index:1;width:50%;height:100%;display:grid;place-items:center;padding:0;color:#f3f6fb;font-size:clamp(8px,.82vw,12px);border-radius:7px;background:transparent}#source-switch .slider{position:absolute;z-index:0;left:2%;top:9%;width:47.3%;height:82%;background:#287cdd;border-radius:7px;transform:translateX(103%);transition:transform 200ms cubic-bezier(.2,.8,.2,1)}#source-switch.original .slider{transform:translateX(0)}@media(prefers-reduced-motion:reduce){#source-switch .slider{transition:none}}#project-name,#project-name-input{position:absolute;left:1.39%;top:7.89%;width:36%;height:2.9%;background:#1c2026;border:0;color:#e8ecf2;padding:0;text-align:left;font:600 clamp(8px,1.1vw,16px) system-ui;display:block;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#project-name-input{outline:2px solid #4c9aff;background:#101318}#project-name[hidden],#project-name-input[hidden]{display:none}#project-name{width:auto;max-width:36%;height:2.7%;font-size:clamp(5px,.75vw,16px);font-weight:500;line-height:1;padding:0 2px;gap:5px;display:flex;align-items:center;outline-offset:2px}#project-name:hover{background:#1c2026}#project-name .edit-mark{font-size:.7em;color:#7e8998;opacity:.45;transition:opacity 120ms}#project-name:hover .edit-mark,#project-name:focus-visible .edit-mark{opacity:1}#project-name-input{font-size:clamp(5px,.75vw,16px)}.artboard-wrap{container-type:inline-size}#project-name,#project-name-input{font-size:1.111cqw}</style>

 data-src="exports/18-motion.png" data-title="统一交互与动效">18 <span>统一交互与动效</span></button><button data-src="exports/19-music-analysis.png" data-title="BPM 与调性分析">19 <span>BPM 与调性分析</span></button><button data-src="exports/20-beat-timeline.png" data-title="节拍器与小节刻度">20 <span>节拍器与小节刻度</span></button><button data-src="exports/21-imported-workspace.png" data-title="导入后工作区">21 <span>导入后工作区</span></button><button data-src="exports/22-secondary-separation.png" data-title="二次分离与其它音轨">22 <span>二次分离与其它音轨</span></button><button data-src="workspace-revision/Ac4ta.png" data-title="工作台修订">23 <span>工作台修订</span></button><button data-src="workspace-revision/a8n0bQ.png" data-title="所有音轨">24 <span>所有音轨</span></button><button data-src="workspace-revision/kdPq6.png" data-title="节奏与调性">25 <span>节奏与调性</span></button><button data-src="workspace-revision/cFom6.png" data-title="快捷键">26 <span>快捷键</span></button><button data-src="workspace-revision/GYMp2.png" data-title="紧凑任务提示">27 <span>紧凑任务提示</span></button><button data-src="workspace-revision/Hq9L2.png" data-title="原生菜单栏">28 <span>原生菜单栏</span></button><button data-src="workspace-revision/x0yR1.png" data-title="平台融合顶栏">29 <span>平台融合顶栏</span></button><button data-src="workspace-revision/ymoeh.png" data-title="多剪辑工作台（当前）">30 <span>多剪辑工作台（当前）</span></button><button data-src="save-recovery/OspP2.png" data-title="保存失败 · 紧凑恢复提示">31 <span>保存失败 · 恢复提示</span></button></nav><section><div class="caption"><h1 id="title">中文多轨工作台</h1><a id="original" href="exports/01-workbench-zh.png" target="_blank">查看原尺寸 PNG ↗</a></div><div class="artboard-wrap"><img id="artboard" src="exports/01-workbench-zh.png" alt="Printemps 中文多轨工作台设计"><button id="project-name" title="修改项目名称">Midnight Session ✎</button><input id="project-name-input" aria-label="项目名称" maxlength="80" hidden><div id="source-switch" role="group" aria-label="试听来源"><span class="slider"></span><button type="button" aria-pressed="false">原始</button><button type="button" aria-pressed="true">分轨</button></div></di <script>const buttons=[...document.querySelectorAll('nav button')];const sourceSwitch=document.getElementById('source-switch');const sourceButtons=[...sourceSwitch.querySelectorAll('button')];function selectSource(index){sourceSwitch.classList.toggle('original',index===0);sourceButtons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)));}sourceButtons.forEach((b,i)=>{b.addEventListener('click',()=>selectSource(i));b.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=e.key==='ArrowLeft'?0:1;selectSource(next);sourceButtons[next].focus();}})});const renameButton=document.getElementById('project-name'),renameInput=document.getElementById('project-name-input');let previewName=localStorage.getItem('printemps-preview-name')||'Midnight Session';let inWorkbench=false;
function finishRename(){renameButton.replaceChildren(document.createTextNode(previewName));const editMark=document.createElement('span');editMark.className='edit-mark';editMark.textContent='✎';renameButton.append(editMark);renameButton.hidden=!inWorkbench;renameInput.hidden=true;}
renameButton.onclick=()=>{renameButton.hidden=true;renameInput.hidden=false;renameInput.value=previewName;renameInput.focus();renameInput.select();};
function commitRename(){if(renameInput.hidden)return;const val=renameInput.value.trim();if(!val){renameInput.setCustomValidity('请输入项目名称');renameInput.reportValidity();return;}renameInput.setCustomValidity('');previewName=val;localStorage.setItem('printemps-preview-name',val);finishRename();}
renameInput.oninput=()=>renameInput.setCustomValidity('');renameInput.onblur=commitRename;renameInput.onkeydown=e=>{if(e.isComposing)return;if(e.key==='Enter'){e.preventDefault();commitRename();}if(e.key==='Escape'){e.preventDefault();finishRename();renameButton.focus();}};
function show(button){const en=button.dataset.src.includes('02-workbench');const work=en||button.dataset.src.includes('01-workbench');inWorkbench=work;finishRename();Object.assign(renameButton.style,{left:(20/(en?1280:1440)*100)+'%',top:(71/(en?800:900)*100)+'%'});Object.assign(renameInput.style,{left:renameButton.style.left,top:renameButton.style.top});sourceSwitch.style.display=work?'flex':'none';const width=en?1280:1440,height=en?800:900;Object.assign(sourceSwitch.style,{left:(256/width*100)+'%',top:(124/height*100)+'%',width:(148/width*100)+'%',height:(34/height*100)+'%'});sourceButtons[0].textContent=en?'Original':'原始';sourceButtons[1].textContent=en?'Stems':'分轨';selectSource(1);buttons.forEach(b=>b.classList.toggle('active',b===button));document.getElementById('artboard').src=button.dataset.src;document.getElementById('artboard').alt=button.dataset.title;document.getElementById('title').textContent=button.dataset.title;document.getElementById('original').href=button.dataset.src;}buttons.forEach(b=>b.addEventListener('click',()=>show(b)));show(buttons.find(b=>b.dataset.src==='workspace-revision/ymoeh.png'));</script></html>
