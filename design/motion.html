<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printemps · 动效预览</title><style>
*{box-sizing:border-box}body{background:#14171b;color:#e8ecf2;font:14px system-ui;margin:0;padding:40px;max-width:1000px;margin:auto}h1{font-size:26px}p{color:#a0aab8}section{margin:32px 0;padding:24px;background:#1c2026;border-radius:16px}button,input{font:inherit;color:inherit;border:1px solid #3a4350;background:#292f38;border-radius:9px;padding:10px 18px;transition:background 120ms,transform 120ms,border-color 120ms}button{cursor:pointer}button:hover{background:#353e4b}button:active{transform:scale(.98)}:focus-visible{outline:2px solid #70abec;outline-offset:3px}.seg{display:flex;position:relative;width:330px;max-width:100%;padding:3px;background:#292f38;border-radius:10px;isolation:isolate}.seg button{flex:1;border:0;background:transparent;padding:8px 0;z-index:1}.slider{position:absolute;inset:3px auto 3px 3px;border-radius:7px;background:#287cdd;width:calc((100% - 6px)/var(--count));transform:translateX(calc(var(--index,0)*100%));transition:transform 200ms cubic-bezier(.2,.8,.2,1)}.cards{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}.cards button{min-width:130px;text-align:left;transition:background 160ms,border-color 160ms}.cards button[aria-pressed=true]{background:#24344d;border-color:#70abec}.cards b{display:inline-grid;place-items:center;width:18px;height:18px;background:#3a4350;border-radius:5px;margin-right:10px;transition:background 160ms,transform 160ms}.cards [aria-pressed=true] b{background:#287cdd;transform:scale(1.08)}input{width:100%;background:#101318}.panel{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 220ms,opacity 180ms}.panel.open{grid-template-rows:1fr;opacity:1}.panel>div{overflow:hidden}.panel p{padding:16px;background:#242b35;border-radius:12px}.primary{background:#287cdd}dialog{background:#202630;color:#e8ecf2;border:1px solid #3a4350;border-radius:16px;padding:28px;width:400px;max-width:90vw}dialog[open]{animation:appear 180ms ease-out}dialog::backdrop{background:#0008}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}button:active{transform:none}}a{color:#70abec}
</style><a href="index.html">← 返回画板</a><h1>统一交互与动效</h1><p>可点击设计样例 · 不执行音频处理或导出</p>
<section><h2>项目名称</h2><div id="rename"><button id="rename-trigger" title="修改项目名称">Midnight Session ✎</button><input id="rename-input" aria-label="项目名称" maxlength="80" hidden><p id="rename-error" role="alert"></p></div><p>点击名称编辑 · Enter 保存 · Esc 取消 · 失焦保存</p></section><section><h2>格式与状态筛选</h2><div class="seg" style="--count:2"><span class="slider"></span><button aria-pressed="true">WAV</button><button aria-pressed="false">FLAC</button></div><br><div class="seg" style="--count:3"><span class="slider"></span><button aria-pressed="true">全部</button><button aria-pressed="false">已缓存</button><button aria-pressed="false">未下载</button></div></section>
<section><h2>声部多选</h2><input type="search" aria-label="搜索声部" placeholder="搜索声部"><div class="cards"><button aria-pressed="true"><b>✓</b>主唱</button><button aria-pressed="false"><b></b>鼓组</button><button aria-pressed="false"><b></b>贝斯</button></div><p id="empty" hidden>没有匹配的声部，请换一个关键词。</p></section>
<section><h2>展开与弹窗</h2><button id="expand" aria-expanded="false">音轨详情</button> <button class="primary" id="export">导出设置</button><div class="panel"><div><p>主唱 · Stereo · 44.1 kHz<br>由应用管理 · 导出后可在外部编辑</p></div></div></section>
<dialog><h2>导出音轨</h2><p>格式设置已保留。此处仅演示弹窗动效。</p><button id="close">完成</button></dialog><script>
let projectName=localStorage.getItem('printemps-preview-name')||'Midnight Session';
const trigger=document.querySelector('#rename-trigger'),nameInput=document.querySelector('#rename-input'),nameError=document.querySelector('#rename-error');
function displayName(){trigger.textContent=projectName+' ✎';trigger.hidden=false;nameInput.hidden=true;nameError.textContent=''}
displayName();trigger.onclick=()=>{trigger.hidden=true;nameInput.hidden=false;nameInput.value=projectName;nameInput.focus();nameInput.select()};
function saveName(){if(nameInput.hidden)return;const next=nameInput.value.trim();if(!next){nameError.textContent='请输入项目名称';return}projectName=next;localStorage.setItem('printemps-preview-name',projectName);displayName()}
nameInput.onblur=saveName;nameInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();saveName();if(nameInput.hidden)trigger.focus()}if(e.key==='Escape'){e.preventDefault();displayName();trigger.focus()}};

document.querySelectorAll('.seg').forEach(seg=>{const bs=[...seg.querySelectorAll('button')];function set(i){seg.style.setProperty('--index',i);bs.forEach((b,j)=>b.setAttribute('aria-pressed',j===i))}bs.forEach((b,i)=>{b.onclick=()=>set(i);b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();let j=(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;set(j);bs[j].focus()}}})});
document.querySelectorAll('.cards button').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.querySelector('b').textContent=on?'✓':''});
document.querySelector('input[type="search"]').oninput=e=>{let count=0;document.querySelectorAll('.cards button').forEach(b=>{b.hidden=!b.textContent.includes(e.target.value.trim());if(!b.hidden)count++});document.querySelector('#empty').hidden=!!count};
document.querySelector('#expand').onclick=e=>{const on=document.querySelector('.panel').classList.toggle('open');e.target.setAttribute('aria-expanded',on)};
const modal=document.querySelector('dialog');document.querySelector('#export').onclick=()=>modal.showModal();document.querySelector('#close').onclick=()=>modal.close();
</script></html>
