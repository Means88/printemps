name: Publish printemps.dev
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the static site is self-contained
        run: |
          test -f site/index.html && test -f site/CNAME && test -f site/assets/workspace.png
          ! grep -rn "http://" site/*.html site/*.js
      - name: Stamp asset URLs with the commit so CDN caches refresh
        run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" site/*.html && grep -c "?v=${GITHUB_SHA::7}" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
