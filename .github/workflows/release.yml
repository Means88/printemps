name: Release installers
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach installers to (for example v0.1.1)
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            resources: release/linux-unpacked/resources
          - os: windows-2025
            resources: release/win-unpacked/resources
          - os: macos-15
            resources: release/mac-arm64/Printemps.app/Contents/Resources
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PRINTEMPS_UV: uv
      PYTHONDONTWRITEBYTECODE: '1'
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # Without CSC_LINK/CSC_KEY_PASSWORD secrets the macOS build is ad-hoc signed and not notarized.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Free unused hosted-runner SDKs for AppImage staging
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run runtime:prepare
      - run: uv cache clean
      - name: Build installers (never publish from the builder)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${CSC_LINK}" ]; then pnpm run dist --config.mac.identity=-; else pnpm run dist; fi
      - name: Verify packaged analysis runtime
        run: pnpm run test:integration
        env:
          PRINTEMPS_TEST_RESOURCES: ${{ matrix.resources }}
      - name: Create the draft release once
        shell: bash
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Printemps $TAG" --generate-notes || true
      - name: Attach installers to the draft release
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.blockmap release/latest*.yml)
          gh release upload "$TAG" "${files[@]}" --clobber
